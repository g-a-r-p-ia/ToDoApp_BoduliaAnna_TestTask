<div class="container mt-4">
  <h1 class="mb-4">My Tasks</h1>

  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="row g-3 mb-4">
    <div class="col-auto">
      <input
        type="text"
        class="form-control"
        formControlName="title"
        placeholder="New task title"
      />
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
        Add Task
      </button>
    </div>
  </form>

  <ul class="list-group">
    @for (task of tasks; track task.id) {
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <input
            type="checkbox"
            class="form-check-input me-2"
            [checked]="task.isCompleted"
            (change)="onToggleComplete(task)"
          />
          <span>{{ task.title }}</span>
        </div>
        <div>
          <button class="btn btn-sm btn-warning me-2" (click)="onEditTask(task)">
            Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="onDeleteTask(task.id)">
            Delete
          </button>
        </div>
      </li>
    }
  </ul>
</div>
